[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
tempo = true
fs_permissions = [{ access = "read", path = "./out"}]

[rpc_endpoints]
moderato = "${TEMPO_TESTNET_RPC_URL}"
tempo = "${TEMPO_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
tempo = { key = "none", url = "https://contracts.tempo.xyz" }
